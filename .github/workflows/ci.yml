name: PR Secret Length Check

on:
  pull_request:
permissions:
  contents: read
  security-events: write
  id-token: write # Required for OIDC authentication with AWS
  packages: write
  actions: write # Required for GHA cache
  pull-requests: write # Required for posting PR comments
jobs:
  print-secret-length:
    runs-on: ubuntu-latest
    steps:
      - name: Print length of SECRETS.S
        run: |
          # Get the length of the secret without printing the secret itself
          SECRET_LENGTH=${#SECRETS_S}
          echo "Length of SECRETS.S: $SECRET_LENGTH"
        env:
          SECRETS_S: ${{ secrets.S }}
